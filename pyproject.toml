[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "jev-eval-lab"
version = "0.1.0"
description = "Reproducible evaluation of typed decision models and LLM judges"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Jev Eval Lab contributors" }]
dependencies = []

[project.optional-dependencies]
analysis = ["matplotlib>=3.9,<4", "numpy>=2,<3"]
datasets = ["pyarrow>=17,<24"]
local-models = ["torch>=2.5", "transformers>=4.51,<5", "safetensors>=0.4"]

[project.scripts]
jev-eval = "jev_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_eval"]

