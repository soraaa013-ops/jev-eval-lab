[experiment]
name = "judgebench-gpt-5-mini"
dataset = "data/benchmarks/judgebench-gpt.jsonl"
output_dir = "artifacts/runs/judgebench-gpt-5-mini"
swap_positions = true
concurrency = 32
limit = 0

[model]
adapter = "openrouter_chat"
id = "openai/gpt-5-mini"
base_url = "https://openrouter.ai/api/v1/chat/completions"
api_key_env = "OPENROUTER_API_KEY"
secrets_file = "configs/secrets.toml"
timeout_seconds = 180
temperature = 0.0
prompt_version = "pairwise-v2-candidate-label"

[metrics]
ece_bins = 15

