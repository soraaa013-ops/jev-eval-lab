[experiment]
name = "chat-sample"
dataset = "data/samples/pairwise.jsonl"
output_dir = "artifacts/runs/chat-sample"
swap_positions = true
concurrency = 4
limit = 0

[model]
adapter = "openrouter_chat"
id = "openai/gpt-5-mini"
base_url = "https://openrouter.ai/api/v1/chat/completions"
api_key_env = "OPENROUTER_API_KEY"
secrets_file = "configs/secrets.toml"
timeout_seconds = 120
temperature = 0.0

[metrics]
ece_bins = 10

